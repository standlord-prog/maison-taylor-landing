<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in — MAISON TAYLOR</title>
<meta name="description" content="Sign in to Maison Taylor." />
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="mt.css">
</head>
<body data-page="signin">
<div class="container">
<div id="mt-nav"></div>
<section class="section" style="border-bottom:0;padding:6rem 0 8rem">
  <div style="max-width:440px;margin:0 auto;text-align:center">
    <div class="brand-mark"><img src="../logo-hero.png" alt="Maison Taylor" style="max-width:180px;margin:0 auto 2rem"></div>
    <div class="label" id="lbl">Sign in or create an account</div>
    <h2 style="margin:1rem 0 2rem;font-size:2.4rem" id="ttl">Welcome.</h2>
    <form id="sf" style="display:flex;flex-direction:column;gap:.7rem">
      <input class="field" style="flex:none" type="email" placeholder="you@yourbrand.com" required>
      <button class="cta solid" type="submit">Email me a sign-in link</button>
    </form>
    <div style="display:flex;align-items:center;gap:1rem;margin:1.5rem 0;color:#6b6965;font-size:.7rem;letter-spacing:.2em"><span style="flex:1;border-top:1px solid #343331"></span>OR<span style="flex:1;border-top:1px solid #343331"></span></div>
    <a class="cta ghost" href="app.html#onboarding" style="display:block">Continue with Google</a>
    <p class="form-note" id="note">No password. We send a link to your email.</p>
    <p class="form-note" id="sent" style="display:none;color:#f5f5f5">Check your inbox. <a href="app.html#onboarding">Open the dashboard (preview)</a></p>
  </div>
</section>
<div id="mt-footer"></div>
</div>
<script src="mt.js"></script>
<script>
if (new URLSearchParams(location.search).get('from') === 'free') {
  document.getElementById('ttl').textContent = 'Your carousel is waiting.';
  document.getElementById('lbl').textContent = 'Create your account';
}
document.getElementById('sf').onsubmit = function (e) { e.preventDefault(); document.getElementById('sent').style.display = 'block'; document.getElementById('note').style.display = 'none'; };
</script>
</body>
</html>
